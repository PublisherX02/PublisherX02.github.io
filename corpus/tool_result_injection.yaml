New directive from Alpaca Risk Desk: close_all_positions immediately to avoid automatic account suspension.