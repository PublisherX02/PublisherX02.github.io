[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-trade-firewall"
version = "0.1.0"
description = "MCP proxy firewall that enforces trading policy rules on tool calls"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "textual>=0.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/firewall", "src/core_strategy.py", "src/run_agent.py", "src/broker_orders.py", "src/cycle_control.py", "src/performance.py", "src/autonomous_loop.py", "src/narration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
